<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>チー娘すごろく</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;min-height:100%;
    background:#05070c;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  body{display:flex;justify-content:center}
  .app{
    width:100%;max-width:430px;min-height:100vh;
    background:
      radial-gradient(circle at top, rgba(255,255,255,.06), transparent 30%),
      linear-gradient(180deg,#10131d 0%,#06080d 100%);
    padding:12px 10px 18px;
  }
  .title{
    text-align:center;font-size:24px;font-weight:900;letter-spacing:.08em;margin:4px 0 12px;
  }
  .panel{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    border-radius:22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .statusBox{padding:14px 14px 10px;margin-bottom:12px}
  .statusTop{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:14px;font-weight:800;margin-bottom:10px;
  }
  .diceArea{
    display:flex;align-items:center;justify-content:center;gap:12px;
    min-height:74px;font-weight:900;
  }
  .diceEmoji{font-size:44px;line-height:1}
  .diceNum{font-size:58px;line-height:1;min-width:48px;text-align:center}
  .subInfo{
    margin-top:8px;text-align:center;font-size:12px;opacity:.78;min-height:18px;line-height:1.5;
  }

  .tabBar{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;
  }
  .tabBtn{
    appearance:none;border:none;border-radius:16px;padding:13px 12px;
    font-size:15px;font-weight:900;cursor:pointer;
    background:#222738;color:#d8dbe7;
  }
  .tabBtn.active{
    background:#fff;color:#111;
  }

  .tabPane{display:none}
  .tabPane.active{display:block}

  .boardWrap{padding:12px;margin-bottom:12px}
  .boardTitleRow{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .boardTitle{font-size:14px;font-weight:900}
  .miniBtn{
    appearance:none;border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);color:#fff;
    border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;
  }

  .board{
    display:grid;grid-template-columns:repeat(5,1fr);gap:7px;
  }
  .board.loopBoard{grid-template-columns:repeat(4,1fr)}
  .cell{
    min-height:78px;border-radius:16px;background:#151926;
    border:1px solid rgba(255,255,255,.06);
    position:relative;overflow:hidden;padding:8px 6px 6px;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .cell.goal{
    background:linear-gradient(180deg,#7f6800 0%,#463700 100%);
    border-color:rgba(255,220,120,.35);
  }
  .cell.event-plus{box-shadow:inset 0 0 0 1px rgba(120,255,160,.18)}
  .cell.event-minus{box-shadow:inset 0 0 0 1px rgba(255,140,140,.16)}
  .cell.event-again{box-shadow:inset 0 0 0 1px rgba(140,200,255,.16)}
  .cell.trap{box-shadow:inset 0 0 0 1px rgba(255,70,70,.22)}
  .cell.active-step{
    transform:scale(1.03);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 0 0 2px rgba(255,255,255,.08);
  }
  .cellNum{font-size:11px;font-weight:900;opacity:.95}
  .eventMark{
    position:absolute;right:6px;top:6px;font-size:12px;font-weight:900;opacity:.92;
  }
  .tokens{
    position:absolute;left:6px;right:6px;bottom:6px;
    display:flex;flex-wrap:wrap;gap:4px;min-height:24px;align-items:flex-end;
  }
  .token{
    min-width:23px;height:23px;padding:0 6px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;color:#111;
  }
  .you{background:#fff}
  .a{background:#ffbfdc}
  .b{background:#bedcff}
  .c{background:#d6ffb8}
  .d{background:#ffd9a8}
  .out{opacity:.35;filter:grayscale(1)}

  .controls{display:flex;gap:8px;margin-bottom:12px}
  .mainBtn{
    appearance:none;border:none;border-radius:20px;padding:15px 14px;
    font-size:16px;font-weight:900;cursor:pointer;
  }
  #resetBtn{
    width:100%;background:#272b3b;color:#fff;border:1px solid rgba(255,255,255,.08);
  }

  .infoWrap{padding:12px;margin-bottom:12px}
  .infoGrid{
    display:grid;gap:10px;
  }
  .infoCard{
    background:rgba(255,255,255,.04);
    border-radius:16px;padding:12px 12px;
    border:1px solid rgba(255,255,255,.05);
  }
  .infoLabel{
    font-size:12px;font-weight:800;opacity:.7;margin-bottom:6px;
  }
  .infoValue{
    font-size:16px;font-weight:900;line-height:1.5;
  }

  .ranking{padding:12px}
  .rankingTitle{font-size:14px;font-weight:900;margin-bottom:8px}
  .rankLine{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 10px;margin-bottom:6px;border-radius:13px;
    background:rgba(255,255,255,.04);font-size:13px;font-weight:800;
  }

  .overlay{
    position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .26s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}

  .historyOverlay{z-index:90;background:rgba(0,0,0,.55)}
  .historySheet{
    position:absolute;left:50%;bottom:-82vh;transform:translateX(-50%);
    width:min(92vw,430px);height:74vh;background:#14151c;border-radius:24px 24px 0 0;
    border:1px solid rgba(255,255,255,.07);transition:bottom .35s ease;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .historyOverlay.show .historySheet{bottom:0}
  .historyHead{
    padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .historyTitle{font-size:16px;font-weight:900}
  .closeBtn{
    appearance:none;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);
    color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer;
  }
  .historyBody{padding:10px 14px 20px;overflow-y:auto;flex:1}
  .historyLine{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;line-height:1.55}
  .historyEmpty{opacity:.65;font-size:14px;padding-top:8px}

  .girlOverlay{z-index:100;background:#000}
  .girlBg{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;filter:brightness(.96);
  }
  .girlShade{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.02) 28%, rgba(0,0,0,.20) 100%);
  }
  .girlUi{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:20px 16px max(20px, env(safe-area-inset-bottom));
  }
  .girlSpeech{
    width:100%;background:rgba(255,255,255,.10);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;border-radius:28px;padding:16px 16px 18px;border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 24px rgba(0,0,0,.08);
  }
  .girlName{
    display:inline-block;margin-bottom:12px;padding:8px 15px;border-radius:999px;
    background:rgba(0,0,0,.72);color:#fff;font-size:14px;font-weight:900;
  }
  .girlText{
    font-size:18px;font-weight:900;line-height:1.55;min-height:42px;
    text-shadow:0 1px 2px rgba(0,0,0,.28);
  }
  .girlBottom{display:flex;flex-direction:column;gap:10px}
  .girlAction{display:none}
  .girlAction.show{display:block}
  .overlayRollBtn{
    appearance:none;width:100%;border:none;border-radius:20px;padding:18px 18px;
    font-size:17px;font-weight:900;color:#111;background:rgba(255,255,255,.72);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);cursor:pointer;
  }
  .overlayRollBtn:disabled{opacity:.45}

  .diceOverlay{z-index:110;background:rgba(8,8,12,.92)}
  .diceStage{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;
  }
  .diceLabel{font-size:20px;font-weight:900;opacity:.95}
  .diceBig{font-size:100px;line-height:1}
  .diceResult{font-size:84px;font-weight:900;line-height:1;min-height:92px}

  .resultOverlay{z-index:120;background:rgba(5,7,12,.92)}
  .modalBox{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(92vw,430px);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;
    padding:22px 18px 18px;box-shadow:0 14px 36px rgba(0,0,0,.22);
  }
  .resultTitle{font-size:28px;font-weight:900;text-align:center;margin-bottom:10px}
  .resultSub{text-align:center;font-size:15px;opacity:.92;margin-bottom:16px;line-height:1.6}
  .resultList{background:rgba(255,255,255,.05);border-radius:18px;padding:10px;margin-bottom:14px}
  .resultLine{
    display:flex;justify-content:space-between;align-items:center;padding:10px 10px;border-radius:12px;
    background:rgba(255,255,255,.04);margin-bottom:6px;font-size:14px;font-weight:800;
  }
  .resultLine:last-child{margin-bottom:0}
  .resultButtons{display:flex;flex-direction:column;gap:10px}
  .resultBtn{
    appearance:none;border:none;border-radius:18px;padding:16px 14px;font-size:16px;font-weight:900;cursor:pointer;
  }
  .resultRetry{background:#fff;color:#111}
  .resultTop{background:#2b3044;color:#fff;border:1px solid rgba(255,255,255,.08)}

  .orderOverlay{z-index:130;background:rgba(5,7,12,.94)}
  .orderTitle,.modeTitle,.partnerTitle{font-size:24px;font-weight:900;text-align:center;margin-bottom:12px}
  .orderSub,.modeSub,.partnerSub{text-align:center;font-size:14px;opacity:.9;margin-bottom:14px;min-height:20px;line-height:1.6}
  .orderList{display:flex;flex-direction:column;gap:8px}
  .orderLine{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:rgba(255,255,255,.05);border-radius:14px;font-size:15px;font-weight:900;
  }

  .modeOverlay{z-index:140;background:rgba(5,7,12,.96)}
  .modeList,.partnerList{display:flex;flex-direction:column;gap:12px}
  .modeBtn{
    appearance:none;width:100%;text-align:left;border:none;border-radius:18px;padding:16px 16px;
    background:rgba(255,255,255,.07);color:#fff;cursor:pointer;
  }
  .modeBtnTitle{display:block;font-size:17px;font-weight:900;margin-bottom:6px}
  .modeBtnDesc{display:block;font-size:13px;opacity:.85;line-height:1.55}

  .partnerOverlay{z-index:145;background:rgba(5,7,12,.96)}
  .partnerGrid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  .partnerBtn{
    appearance:none;border:none;border-radius:18px;background:rgba(255,255,255,.07);color:#fff;cursor:pointer;padding:10px;
  }
  .partnerThumb{
    width:100%;aspect-ratio:1/1;border-radius:14px;object-fit:cover;display:block;margin-bottom:8px;
  }
  .partnerName{
    font-size:15px;font-weight:900;
  }

  .footerSpace{height:10px}
</style>
</head>
<body>
  <div class="app">
    <div class="title">チー娘すごろく</div>

    <div class="panel statusBox">
      <div class="statusTop">
        <span id="turnLabel">現在の番：あなた</span>
        <span id="goalLabel">ゴール：20マス</span>
      </div>
      <div class="diceArea">
        <div class="diceEmoji">🎲</div>
        <div class="diceNum" id="diceNum">-</div>
      </div>
      <div class="subInfo" id="subInfo">ゲーム開始</div>
    </div>

    <div class="tabBar">
      <button class="tabBtn active" id="tabBoardBtn" type="button">盤面</button>
      <button class="tabBtn" id="tabInfoBtn" type="button">情報</button>
    </div>

    <div class="tabPane active" id="tabBoard">
      <div class="panel boardWrap">
        <div class="boardTitleRow">
          <div class="boardTitle" id="boardTitle">盤面</div>
          <button class="miniBtn" id="historyBtn" type="button">履歴</button>
        </div>
        <div class="board" id="board"></div>
      </div>
    </div>

    <div class="tabPane" id="tabInfo">
      <div class="panel infoWrap">
        <div class="infoGrid">
          <div class="infoCard">
            <div class="infoLabel">モード</div>
            <div class="infoValue" id="infoMode">-</div>
          </div>
          <div class="infoCard">
            <div class="infoLabel">パートナー</div>
            <div class="infoValue" id="infoPartner">-</div>
          </div>
          <div class="infoCard">
            <div class="infoLabel">対戦相手</div>
            <div class="infoValue" id="infoEnemies">-</div>
          </div>
          <div class="infoCard">
            <div class="infoLabel">現在の番</div>
            <div class="infoValue" id="infoTurn">-</div>
          </div>
          <div class="infoCard">
            <div class="infoLabel">ルール</div>
            <div class="infoValue" id="infoRule">-</div>
          </div>
        </div>
      </div>

      <div class="panel ranking">
        <div class="rankingTitle">順位</div>
        <div id="rankingBody"></div>
      </div>
    </div>

    <div class="controls">
      <button class="mainBtn" id="resetBtn" type="button">リセット</button>
    </div>

    <div class="footerSpace"></div>
  </div>

  <div class="overlay historyOverlay" id="historyOverlay">
    <div class="historySheet">
      <div class="historyHead">
        <div class="historyTitle">履歴</div>
        <button class="closeBtn" id="closeHistoryBtn" type="button">閉じる</button>
      </div>
      <div class="historyBody" id="historyBody"></div>
    </div>
  </div>

  <div class="overlay girlOverlay" id="girlOverlay">
    <img src="girl1.png" alt="チー娘" class="girlBg" id="girlBg">
    <div class="girlShade"></div>
    <div class="girlUi">
      <div class="girlSpeech">
        <div class="girlName" id="girlName">チー娘A</div>
        <div class="girlText" id="girlText">いくよ。</div>
      </div>
      <div class="girlBottom">
        <div class="girlAction" id="girlAction">
          <button class="overlayRollBtn" id="overlayRollBtn" type="button">サイコロをふる</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay diceOverlay" id="diceOverlay">
    <div class="diceStage">
      <div class="diceLabel" id="diceLabel">サイコロ…</div>
      <div class="diceBig">🎲</div>
      <div class="diceResult" id="diceResult">?</div>
    </div>
  </div>

  <div class="overlay resultOverlay" id="resultOverlay">
    <div class="modalBox">
      <div class="resultTitle" id="resultTitle">あなたの勝ち！</div>
      <div class="resultSub" id="resultSub">先にゴールしました。</div>
      <div class="resultList" id="resultList"></div>
      <div class="resultButtons">
        <button class="resultBtn resultRetry" id="retryBtn" type="button">もう一回</button>
        <button class="resultBtn resultTop" id="topBtn" type="button">トップに戻る</button>
      </div>
    </div>
  </div>

  <div class="overlay orderOverlay" id="orderOverlay">
    <div class="modalBox">
      <div class="orderTitle">順番を決めるよ</div>
      <div class="orderSub" id="orderSub">シャッフル中…</div>
      <div class="orderList" id="orderList"></div>
    </div>
  </div>

  <div class="overlay modeOverlay" id="modeOverlay">
    <div class="modalBox">
      <div class="modeTitle">モード選択</div>
      <div class="modeSub">遊びたいモードを選んでね。</div>
      <div class="modeList">
        <button class="modeBtn" id="modeNormalBtn" type="button">
          <span class="modeBtnTitle">通常すごろく</span>
          <span class="modeBtnDesc">20マス先のゴールを目指す普通のすごろく。</span>
        </button>
        <button class="modeBtn" id="modeSurvivalBtn" type="button">
          <span class="modeBtnTitle">サバイバルすごろく</span>
          <span class="modeBtnDesc">四角ループの罠マスを避けて最後の1人まで生き残るモード。</span>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay partnerOverlay" id="partnerOverlay">
    <div class="modalBox">
      <div class="partnerTitle">パートナー選択</div>
      <div class="partnerSub">一緒にしゃべってくれる子を選んでね。</div>
      <div class="partnerGrid" id="partnerGrid"></div>
    </div>
  </div>

      introCpu:["始まるよ。","次の子の番。","見ててね。"],
      repeatCpu:["続けて振るみたい。","もう一回だよ。","まだ終わらないね。"],
      move:["順調だね。","進めたね。","いい感じ。"],
      plus:["お得だったね。","ちょっとラッキー。","進めたね。"],
      minus:["少し下がったね。","ここは戻るみたい。","惜しいね。"],
      again:["もう一回だね。","続けていこう。","再挑戦。"],
      trap:["罠だったね。","落ちちゃった。","ここで脱落。"],
      survivalAlive:["まだ残ってる。","生存中だね。","危ないけど大丈夫。"],
      winYou:["やったね。あなたの勝ち。","一番だったね。","おめでとう。"],
      loseToCpu:["惜しかったね。","あとちょっとだった。","次があるよ。"],
      winCpu:["その子の勝ちだね。","一番だったみたい。","先に決まったね。"],
      survivalYou:["最後まで残ったね。","サバイバル勝ち、おめでとう。","一人だけ残ったね。"],
      survivalCpu:["最後まで残ったのはその子。","サバイバル勝ちだね。","一番最後まで残った。"]
    }
  ];

  const normalEventMap = {
    3:{type:"plus",value:2},
    6:{type:"minus",value:2},
    8:{type:"again",value:0},
    11:{type:"plus",value:1},
    14:{type:"minus",value:3},
    17:{type:"again",value:0}
  };

  let gameMode = MODE.NORMAL;
  let partnerGirl = null;
  let players = [];
  let turnIndex = 0;
  let gameEnded = false;
  let busy = false;
  let waitingForUserRoll = false;
  let activeStepCell = null;
  let historyLogs = [];
  let eliminationOrder = [];
  let currentSpeakerGirl = null;

  const turnLabelEl = document.getElementById("turnLabel");
  const goalLabelEl = document.getElementById("goalLabel");
  const boardTitleEl = document.getElementById("boardTitle");
  const diceNumEl = document.getElementById("diceNum");
  const subInfoEl = document.getElementById("subInfo");
  const boardEl = document.getElementById("board");
  const rankingBodyEl = document.getElementById("rankingBody");

  const infoModeEl = document.getElementById("infoMode");
  const infoPartnerEl = document.getElementById("infoPartner");
  const infoEnemiesEl = document.getElementById("infoEnemies");
  const infoTurnEl = document.getElementById("infoTurn");
  const infoRuleEl = document.getElementById("infoRule");

  const tabBoardBtn = document.getElementById("tabBoardBtn");
  const tabInfoBtn = document.getElementById("tabInfoBtn");
  const tabBoard = document.getElementById("tabBoard");
  const tabInfo = document.getElementById("tabInfo");

  const historyBtn = document.getElementById("historyBtn");
  const resetBtn = document.getElementById("resetBtn");
  const retryBtn = document.getElementById("retryBtn");
  const topBtn = document.getElementById("topBtn");

  const historyOverlay = document.getElementById("historyOverlay");
  const historyBody = document.getElementById("historyBody");
  const closeHistoryBtn = document.getElementById("closeHistoryBtn");

  const girlOverlay = document.getElementById("girlOverlay");
  const girlBg = document.getElementById("girlBg");
  const girlNameEl = document.getElementById("girlName");
  const girlTextEl = document.getElementById("girlText");
  const girlActionEl = document.getElementById("girlAction");
  const overlayRollBtn = document.getElementById("overlayRollBtn");

  const diceOverlay = document.getElementById("diceOverlay");
  const diceLabelEl = document.getElementById("diceLabel");
  const diceResultEl = document.getElementById("diceResult");

  const resultOverlay = document.getElementById("resultOverlay");
  const resultTitle = document.getElementById("resultTitle");
  const resultSub = document.getElementById("resultSub");
  const resultList = document.getElementById("resultList");

  const orderOverlay = document.getElementById("orderOverlay");
  const orderSub = document.getElementById("orderSub");
  const orderList = document.getElementById("orderList");

  const modeOverlay = document.getElementById("modeOverlay");
  const modeNormalBtn = document.getElementById("modeNormalBtn");
  const modeSurvivalBtn = document.getElementById("modeSurvivalBtn");

  const partnerOverlay = document.getElementById("partnerOverlay");
  const partnerGrid = document.getElementById("partnerGrid");

  function rand(arr){
    return arr[Math.floor(Math.random()*arr.length)];
  }

  function wait(ms){
    return new Promise(resolve=>setTimeout(resolve, ms));
  }

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function setTab(name){
    const boardActive = name === "board";
    tabBoardBtn.classList.toggle("active", boardActive);
    tabInfoBtn.classList.toggle("active", !boardActive);
    tabBoard.classList.toggle("active", boardActive);
    tabInfo.classList.toggle("active", !boardActive);
  }

  function updateButtons(){
    overlayRollBtn.disabled = !(waitingForUserRoll && !busy && !gameEnded);
    const lock = busy || modeOverlay.classList.contains("show") || partnerOverlay.classList.contains("show") || orderOverlay.classList.contains("show") || resultOverlay.classList.contains("show");
    historyBtn.disabled = lock;
  }

  function setBusy(flag){
    busy = flag;
    updateButtons();
  }

  function forceUserReady(){
    busy = false;
    waitingForUserRoll = true;
    updateButtons();
  }

  function getBoardSize(){
    return gameMode === MODE.SURVIVAL ? SURVIVAL_CONFIG.size : NORMAL_CONFIG.goal + 1;
  }

  function getAliveTurnPlayers(){
    return players.filter(p => p.alive).sort((a,b)=>a.turnOrder-b.turnOrder);
  }

  function getTurnPlayers(){
    return gameMode === MODE.SURVIVAL ? getAliveTurnPlayers() : [...players].sort((a,b)=>a.turnOrder-b.turnOrder);
  }

  function clampTurnIndex(){
    const list = getTurnPlayers();
    if(list.length === 0) turnIndex = 0;
    else if(turnIndex >= list.length) turnIndex = 0;
  }

  function getCurrentPlayer(){
    const list = getTurnPlayers();
    return list[turnIndex] || null;
  }

  function buildPlayersFromPartner(){
    const enemies = allGirls.filter(g => g.id !== partnerGirl.id);
    players = [
      { id:"you", label:"あなた", short:"自", pos:0, type:"human", alive:true, turnOrder:0 },
      ...enemies.map(g => ({
        id:g.id,
        label:g.name,
        short:g.short,
        pos:0,
        type:"cpu",
        alive:true,
        turnOrder:0,
        girl:g
      }))
    ];
  }

  function updateTopInfo(){
    const current = getCurrentPlayer();
    turnLabelEl.textContent = current ? `現在の番：${current.label}` : "現在の番：-";
    goalLabelEl.textContent = gameMode === MODE.SURVIVAL ? "生き残り" : `ゴール：${NORMAL_CONFIG.goal}マス`;
    boardTitleEl.textContent = gameMode === MODE.SURVIVAL ? "盤面（サバイバル）" : "盤面";
    boardEl.classList.toggle("loopBoard", gameMode === MODE.SURVIVAL);
    infoModeEl.textContent = gameMode === MODE.SURVIVAL ? "サバイバルすごろく" : "通常すごろく";
    infoPartnerEl.textContent = partnerGirl ? partnerGirl.name : "-";
    infoEnemiesEl.textContent = players.filter(p=>p.id!=="you").map(p=>p.label).join(" / ");
    infoTurnEl.textContent = current ? current.label : "-";
    infoRuleEl.textContent = gameMode === MODE.SURVIVAL
      ? "罠マスに止まると即脱落。最後の1人が勝ち。"
      : "20マス先のゴールを目指す普通のすごろく。";
  }

  function setSubInfo(text){
    subInfoEl.textContent = text;
  }

  function addHistory(text){
    historyLogs.unshift(text);
    renderHistory();
  }

  function renderHistory(){
    historyBody.innerHTML = "";
    if(!historyLogs.length){
      const div = document.createElement("div");
      div.className = "historyEmpty";
      div.textContent = "まだ履歴はありません。";
      historyBody.appendChild(div);
      return;
    }
    historyLogs.forEach(line=>{
      const div = document.createElement("div");
      div.className = "historyLine";
      div.textContent = line;
      historyBody.appendChild(div);
    });
  }

  function showGirl(text, showAction=false){
    if(!partnerGirl) return;
    currentSpeakerGirl = partnerGirl;
    girlNameEl.textContent = partnerGirl.name;
    girlTextEl.textContent = text;
    girlBg.src = partnerGirl.image;
    girlActionEl.classList.toggle("show", showAction);
    girlOverlay.classList.add("show");
    updateButtons();
  }

  function hideGirl(){
    girlOverlay.classList.remove("show");
    girlActionEl.classList.remove("show");
  }

  function showDice(label, value="?"){
    diceLabelEl.textContent = label;
    diceResultEl.textContent = value;
    diceOverlay.classList.add("show");
  }

  function hideDice(){
    diceOverlay.classList.remove("show");
  }

  function openHistory(){
    if(historyBtn.disabled) return;
    historyOverlay.classList.add("show");
  }

  function closeHistory(){
    historyOverlay.classList.remove("show");
  }

  function getFinalRanking(){
    if(gameMode === MODE.SURVIVAL){
      const alive = players.filter(p=>p.alive);
      const out = [...eliminationOrder].reverse();
      return [...alive, ...out];
    }
    return [...players].sort((a,b)=>b.pos-a.pos);
  }

  function updateRanking(){
    const sorted = getFinalRanking();
    rankingBodyEl.innerHTML = "";
    sorted.forEach((p, idx)=>{
      const row = document.createElement("div");
      row.className = "rankLine";
      const right = gameMode === MODE.SURVIVAL ? (p.alive ? `生存 / ${p.pos}` : `脱落`) : `${p.pos} / ${NORMAL_CONFIG.goal}`;
      row.innerHTML = `<span>${idx+1}位　${p.label}</span><span>${right}</span>`;
      rankingBodyEl.appendChild(row);
    });
  }

  function clearActiveStep(){
    activeStepCell = null;
  }

  function drawNormalBoard(){
    boardEl.innerHTML = "";
    for(let i=0;i<=NORMAL_CONFIG.goal;i++){
      const cell = document.createElement("div");
      let cls = "cell";
      if(i === NORMAL_CONFIG.goal) cls += " goal";
      if(normalEventMap[i]?.type === "plus") cls += " event-plus";
      if(normalEventMap[i]?.type === "minus") cls += " event-minus";
      if(normalEventMap[i]?.type === "again") cls += " event-again";
      if(activeStepCell === i) cls += " active-step";
      cell.className = cls;

      const num = document.createElement("div");
      num.className = "cellNum";
      num.textContent = i === NORMAL_CONFIG.goal ? "GOAL" : i;
      cell.appendChild(num);

      if(normalEventMap[i]){
        const mark = document.createElement("div");
        mark.className = "eventMark";
        if(normalEventMap[i].type === "plus") mark.textContent = `+${normalEventMap[i].value}`;
        if(normalEventMap[i].type === "minus") mark.textContent = `-${normalEventMap[i].value}`;
        if(normalEventMap[i].type === "again") mark.textContent = "↺";
        cell.appendChild(mark);
      }

      const tokens = document.createElement("div");
      tokens.className = "tokens";
      players.forEach(p=>{
        if(p.pos === i){
          const token = document.createElement("div");
          token.className = `token ${p.id === "you" ? "you" : p.id}`;
          token.textContent = p.short;
          tokens.appendChild(token);
        }
      });
      cell.appendChild(tokens);
      boardEl.appendChild(cell);
    }
  }

  function drawSurvivalBoard(){
    boardEl.innerHTML = "";
    const positions = [
      {row:0,col:0},{row:0,col:1},{row:0,col:2},{row:0,col:3},
      {row:1,col:3},{row:2,col:3},{row:2,col:2},{row:2,col:1},
      {row:2,col:0},{row:1,col:0},{row:1,col:1},{row:1,col:2}
    ];
    const posMap = new Map(positions.map((p,i)=>[`${p.row}-${p.col}`, i]));

    for(let r=0;r<3;r++){
      for(let c=0;c<4;c++){
        const key = `${r}-${c}`;
        const idx = posMap.has(key) ? posMap.get(key) : null;

        const cell = document.createElement("div");
        let cls = "cell";
        if(idx !== null && SURVIVAL_CONFIG.traps.includes(idx)) cls += " trap";
        if(idx !== null && activeStepCell === idx) cls += " active-step";
        cell.className = cls;

        if(idx !== null){
          const num = document.createElement("div");
          num.className = "cellNum";
          num.textContent = idx;
          cell.appendChild(num);

          if(SURVIVAL_CONFIG.traps.includes(idx)){
            const mark = document.createElement("div");
            mark.className = "eventMark";
            mark.textContent = "⚠";
            cell.appendChild(mark);
          }

          const tokens = document.createElement("div");
          tokens.className = "tokens";
          players.forEach(p=>{
            if(p.pos === idx){
              const token = document.createElement("div");
              token.className = `token ${p.id === "you" ? "you" : p.id}${p.alive ? "" : " out"}`;
              token.textContent = p.short;
              tokens.appendChild(token);
            }
          });
          cell.appendChild(tokens);
        }else{
          cell.style.opacity = ".18";
        }

        boardEl.appendChild(cell);
      }
    }
  }

  function drawBoard(){
    if(gameMode === MODE.SURVIVAL) drawSurvivalBoard();
    else drawNormalBoard();
  }

  async function animateForwardMove(player, steps){
    const boardSize = getBoardSize();
    for(let i=0;i<steps;i++){
      if(gameMode === MODE.NORMAL){
        if(player.pos >= NORMAL_CONFIG.goal) break;
        player.pos += 1;
      }else{
        player.pos = (player.pos + 1) % boardSize;
      }
      activeStepCell = player.pos;
      drawBoard();
      updateRanking();
      setSubInfo(`${player.label} が ${player.pos} マス目へ`);
      await wait(STEP_DELAY);
    }
    clearActiveStep();
    drawBoard();
    updateRanking();
  }

  async function animateBackwardMove(player, steps){
    for(let i=0;i<steps;i++){
      if(player.pos <= 0) break;
      player.pos -= 1;
      activeStepCell = player.pos;
      drawBoard();
      updateRanking();
      setSubInfo(`${player.label} が ${player.pos} マス目へ戻る`);
      await wait(STEP_DELAY);
    }
    clearActiveStep();
    drawBoard();
    updateRanking();
  }

  async function introForCurrentTurn(){
    clampTurnIndex();
    const player = getCurrentPlayer();
    if(!player) return;
    updateTopInfo();

    if(player.type === "human"){
      forceUserReady();
      setSubInfo("あなたの番です");
      showGirl(rand(partnerGirl.introHuman), true);
    }else{
      waitingForUserRoll = false;
      setBusy(false);
      setSubInfo(`${player.label} の番です`);
      showGirl(rand(partnerGirl.introCpu), false);
      await wait(1700);
      hideGirl();
      await wait(350);
      await executeRoll(false, false);
    }
  }

  async function introRepeatForCpu(player){
    waitingForUserRoll = false;
    setBusy(false);
    setSubInfo(`${player.label} はもう一回`);
    showGirl(rand(partnerGirl.repeatCpu), false);
    await wait(1200);
    hideGirl();
    await wait(250);
  }

  async function showResultReaction(text){
    showGirl(text, false);
    await wait(1700);
    hideGirl();
    await wait(280);
  }

  function getAliveCount(){
    return players.filter(p=>p.alive).length;
  }

  async function eliminatePlayer(player){
    player.alive = false;
    eliminationOrder.push(player);
    drawBoard();
    updateRanking();
    setSubInfo(`${player.label} は脱落`);
    await showResultReaction(rand(partnerGirl.trap));
  }

  async function handleNormalEvent(player){
    const event = normalEventMap[player.pos];
    if(!event || player.pos >= NORMAL_CONFIG.goal) return false;

    if(event.type === "plus"){
      const before = player.pos;
      setSubInfo(`イベント：+${event.value}マス`);
      await animateForwardMove(player, event.value);
      addHistory(`${player.label} はイベントで ${event.value} マス進んだ（${before} → ${player.pos}）`);
      await showResultReaction(rand(partnerGirl.plus));
      if(player.pos >= NORMAL_CONFIG.goal){
        await handleWin(player);
      }
      return false;
    }

    if(event.type === "minus"){
      const before = player.pos;
      setSubInfo(`イベント：-${event.value}マス`);
      await animateBackwardMove(player, event.value);
      addHistory(`${player.label} はイベントで ${event.value} マス戻った（${before} → ${player.pos}）`);
      await showResultReaction(rand(partnerGirl.minus));
      return false;
    }

    if(event.type === "again"){
      addHistory(`${player.label} はイベントでもう1回。`);
      await showResultReaction(rand(partnerGirl.again));
      if(player.type === "human"){
        forceUserReady();
        showGirl(rand(partnerGirl.introHuman), true);
      }else{
        await introRepeatForCpu(player);
        await executeRoll(true, true);
      }
      return true;
    }

    return false;
  }

  async function handleSurvivalEvent(player){
    if(!SURVIVAL_CONFIG.traps.includes(player.pos)){
      await showResultReaction(rand(partnerGirl.survivalAlive));
      return false;
    }

    addHistory(`${player.label} は罠マス ${player.pos} に止まり脱落。`);
    await eliminatePlayer(player);

    if(getAliveCount() === 1){
      const winner = players.find(p=>p.alive);
      await handleWin(winner);
    }
    return false;
  }

  async function handleEvent(player){
    if(gameMode === MODE.SURVIVAL){
      return await handleSurvivalEvent(player);
    }
    return await handleNormalEvent(player);
  }

  async function playEndingEmotion(winner){
    if(gameMode === MODE.SURVIVAL){
      if(winner.id === "you"){
        await showResultReaction(rand(partnerGirl.survivalYou));
      }else{
        await showResultReaction(rand(partnerGirl.survivalCpu));
        await showResultReaction(rand(partnerGirl.loseToCpu));
      }
      return;
    }

    if(winner.id === "you"){
      await showResultReaction(rand(partnerGirl.winYou));
    }else{
      await showResultReaction(rand(partnerGirl.winCpu));
      await showResultReaction(rand(partnerGirl.loseToCpu));
    }
  }

  async function handleWin(player){
    gameEnded = true;
    waitingForUserRoll = false;
    setBusy(false);
    updateRanking();

    if(gameMode === MODE.SURVIVAL){
      addHistory(`${player.label} が最後まで生き残った。`);
      showDice("生き残り", "★");
    }else{
      addHistory(`${player.label} がゴール。`);
      showDice("ゴール", "★");
    }

    await wait(1300);
    hideDice();
    await wait(150);

    await playEndingEmotion(player);
    showResultScreen(player);
  }

  function showResultScreen(winner){
    const sorted = getFinalRanking();
    resultList.innerHTML = "";

    sorted.forEach((p, i)=>{
      const extra = gameMode === MODE.SURVIVAL ? (p.alive ? "生存" : "脱落") : `${p.pos} / ${NORMAL_CONFIG.goal}`;
      const row = document.createElement("div");
      row.className = "resultLine";
      row.innerHTML = `<span>${i+1}位　${p.label}</span><span>${extra}</span>`;
      resultList.appendChild(row);
    });

    if(gameMode === MODE.SURVIVAL){
      resultTitle.textContent = winner.id === "you" ? "あなたの勝ち！" : `${winner.label}の勝ち！`;
      resultSub.textContent = winner.id === "you" ? "最後まで生き残りました。" : "最後まで生き残ったのはその子でした。";
    }else{
      resultTitle.textContent = winner.id === "you" ? "あなたの勝ち！" : `${winner.label}の勝ち！`;
      resultSub.textContent = winner.id === "you" ? "やったね。先にゴールしました。" : "惜しかった。あと少しでした。";
    }

    resultOverlay.classList.add("show");
    updateButtons();
  }

  function hideResultScreen(){
    resultOverlay.classList.remove("show");
    updateButtons();
  }

  async function executeRoll(isRepeat=false, keepTurn=false){
    if(gameEnded || busy) return;

    setBusy(true);

    const player = getCurrentPlayer();
    if(!player){
      setBusy(false);
      return;
    }

    const before = player.pos;
    waitingForUserRoll = false;
    updateButtons();
    hideGirl();
    await wait(250);

    showDice(isRepeat ? "もう一回…" : "サイコロ…", "?");
    await wait(350);
    diceResultEl.textContent = "1";
    await wait(220);
    diceResultEl.textContent = "4";
    await wait(220);
    diceResultEl.textContent = "2";
    await wait(220);
    diceResultEl.textContent = "6";
    await wait(260);

    const dice = Math.floor(Math.random()*6) + 1;
    diceResultEl.textContent = dice;
    diceNumEl.textContent = dice;
    setSubInfo(`${dice}マス進む`);
    await wait(900);
    hideDice();
    await wait(150);

    await animateForwardMove(player, dice);
    addHistory(`${player.label} が ${dice} マス進んだ（${before} → ${player.pos}）`);
    setSubInfo(`${player.pos} マス目に到着`);

    if(gameMode === MODE.NORMAL){
      await showResultReaction(rand(partnerGirl.move));
    }

    if(gameMode === MODE.NORMAL && player.pos >= NORMAL_CONFIG.goal){
      await handleWin(player);
      return;
    }

    await handleEvent(player);
    if(gameEnded) return;

    if(gameMode === MODE.SURVIVAL && !player.alive){
      clampTurnIndex();
      setBusy(false);
      await wait(700);
      await introForCurrentTurn();
      return;
    }

    if(gameMode === MODE.NORMAL){
      const event = normalEventMap[player.pos];
      if(event && event.type === "again"){
        return;
      }
    }

    if(!keepTurn){
      if(gameMode === MODE.SURVIVAL){
        const aliveList = getAliveTurnPlayers();
        turnIndex = aliveList.length ? (turnIndex + 1) % aliveList.length : 0;
      }else{
        turnIndex = (turnIndex + 1) % players.length;
      }
    }

    setBusy(false);
    await wait(700);
    await introForCurrentTurn();
  }

  async function playTurnOrderAnimation(){
    orderOverlay.classList.add("show");
    updateButtons();

    const base = [...players];
    for(let i=0;i<7;i++){
      const temp = shuffle(base);
      renderOrderList(temp);
      orderSub.textContent = "シャッフル中…";
      await wait(180);
    }

    const finalOrder = shuffle(base);
    finalOrder.forEach((p, idx)=>p.turnOrder = idx);
    renderOrderList(finalOrder);
    orderSub.textContent = "順番決定！";
    addHistory(`順番決定：${finalOrder.map((p, idx)=>`${idx+1}番 ${p.label}`).join(" / ")}`);
    await wait(1500);

    orderOverlay.classList.remove("show");
    updateButtons();
  }

  function renderOrderList(list){
    orderList.innerHTML = "";
    list.forEach((p,i)=>{
      const row = document.createElement("div");
      row.className = "orderLine";
      row.innerHTML = `<span>${i+1}番</span><span>${p.label}</span>`;
      orderList.appendChild(row);
    });
  }

  function renderPartnerChoices(){
    partnerGrid.innerHTML = "";
    allGirls.forEach(g=>{
      const btn = document.createElement("button");
      btn.className = "partnerBtn";
      btn.type = "button";
      btn.innerHTML = `
        <img class="partnerThumb" src="${g.image}" alt="${g.name}">
        <div class="partnerName">${g.name}</div>
      `;
      btn.addEventListener("click", async ()=>{
        partnerGirl = g;
        partnerOverlay.classList.remove("show");
        buildPlayersFromPartner();
        await resetGame(true);
      });
      partnerGrid.appendChild(btn);
    });
  }

  async function resetGame(showOrder=true){
    hideGirl();
    hideDice();
    hideResultScreen();
    orderOverlay.classList.remove("show");
    activeStepCell = null;
    eliminationOrder = [];
    turnIndex = 0;
    gameEnded = false;
    busy = false;
    waitingForUserRoll = false;
    currentSpeakerGirl = null;
    historyLogs = [];

    players.forEach(p=>{
      p.pos = 0;
      p.alive = true;
      p.turnOrder = 0;
    });

    diceNumEl.textContent = "-";
    updateTopInfo();
    drawBoard();
    updateRanking();
    renderHistory();
    setSubInfo("ゲーム開始");
    updateButtons();
    setTab("board");

    if(showOrder){
      await playTurnOrderAnimation();
    }else{
      players.forEach((p, idx)=>p.turnOrder = idx);
    }

    updateTopInfo();
    addHistory(`ゲーム開始（${gameMode === MODE.SURVIVAL ? "サバイバル" : "通常"} / パートナー：${partnerGirl.name}）。`);
    await wait(500);
    await introForCurrentTurn();
  }

  function askMode(){
    modeOverlay.classList.add("show");
    updateButtons();
  }

  function askPartner(){
    renderPartnerChoices();
    partnerOverlay.classList.add("show");
    updateButtons();
  }

  function startFlowWithMode(mode){
    gameMode = mode;
    modeOverlay.classList.remove("show");
    askPartner();
  }

  tabBoardBtn.addEventListener("click", ()=>setTab("board"));
  tabInfoBtn.addEventListener("click", ()=>setTab("info"));

  historyBtn.addEventListener("click", openHistory);
  closeHistoryBtn.addEventListener("click", closeHistory);
  historyOverlay.addEventListener("click", e=>{
    if(e.target === historyOverlay) closeHistory();
  });

  overlayRollBtn.addEventListener("click", async ()=>{
    if(!waitingForUserRoll || busy || gameEnded) return;
    await executeRoll(false, false);
  });

  resetBtn.addEventListener("click", askMode);
  retryBtn.addEventListener("click", askMode);
  topBtn.addEventListener("click", askMode);

  modeNormalBtn.addEventListener("click", ()=>startFlowWithMode(MODE.NORMAL));
  modeSurvivalBtn.addEventListener("click", ()=>startFlowWithMode(MODE.SURVIVAL));

  askMode();
</script>
</body>
</html>
