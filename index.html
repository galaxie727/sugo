<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>チー娘すごろく</title>
<style>
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#05070c;
    color:#fff;
    font-family:sans-serif;
  }

  body{
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:
      radial-gradient(circle at top, rgba(255,255,255,.06), transparent 30%),
      linear-gradient(180deg,#10131d 0%,#06080d 100%);
    padding:12px 10px 18px;
  }

  .title{
    text-align:center;
    font-size:24px;
    font-weight:900;
    letter-spacing:.08em;
    margin:4px 0 12px;
  }

  .panel{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
    border-radius:22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }

  .statusBox{
    padding:14px 14px 10px;
    margin-bottom:12px;
  }

  .statusTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:14px;
    font-weight:800;
    margin-bottom:10px;
  }

  .diceArea{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    min-height:74px;
    font-weight:900;
  }

  .diceEmoji{
    font-size:44px;
    line-height:1;
  }

  .diceNum{
    font-size:58px;
    line-height:1;
    min-width:48px;
    text-align:center;
  }

  .subInfo{
    margin-top:8px;
    text-align:center;
    font-size:12px;
    opacity:.75;
    min-height:18px;
  }

  .boardWrap{
    padding:12px;
    margin-bottom:12px;
  }

  .boardTitleRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }

  .boardTitle{
    font-size:14px;
    font-weight:900;
  }

  .miniBtn{
    appearance:none;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);
    color:#fff;
    border-radius:999px;
    padding:8px 12px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
  }

  .cell{
    min-height:78px;
    border-radius:16px;
    background:#151926;
    border:1px solid rgba(255,255,255,.06);
    position:relative;
    overflow:hidden;
    padding:8px 6px 6px;
    transition:transform .12s ease, box-shadow .12s ease;
  }

  .cell.goal{
    background:linear-gradient(180deg,#7f6800 0%,#463700 100%);
    border-color:rgba(255,220,120,.35);
  }

  .cell.event-plus{
    box-shadow:inset 0 0 0 1px rgba(120,255,160,.18);
  }

  .cell.event-minus{
    box-shadow:inset 0 0 0 1px rgba(255,140,140,.16);
  }

  .cell.event-again{
    box-shadow:inset 0 0 0 1px rgba(140,200,255,.16);
  }

  .cell.active-step{
    transform:scale(1.03);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.16),
      0 0 0 2px rgba(255,255,255,.08);
  }

  .cellNum{
    font-size:11px;
    font-weight:900;
    opacity:.95;
  }

  .eventMark{
    position:absolute;
    right:6px;
    top:6px;
    font-size:12px;
    font-weight:900;
    opacity:.92;
  }

  .tokens{
    position:absolute;
    left:6px;
    right:6px;
    bottom:6px;
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    min-height:24px;
    align-items:flex-end;
  }

  .token{
    min-width:23px;
    height:23px;
    padding:0 6px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    color:#111;
  }

  .you{ background:#fff; }
  .a{ background:#ffbfdc; }
  .b{ background:#bedcff; }
  .c{ background:#d6ffb8; }

  .controls{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }

  .mainBtn{
    appearance:none;
    border:none;
    border-radius:20px;
    padding:15px 14px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
  }

  #resetBtn{
    width:100%;
    background:#272b3b;
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
  }

  .ranking{
    padding:12px;
  }

  .rankingTitle{
    font-size:14px;
    font-weight:900;
    margin-bottom:8px;
  }

  .rankLine{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 10px;
    margin-bottom:6px;
    border-radius:13px;
    background:rgba(255,255,255,.04);
    font-size:13px;
    font-weight:800;
  }

  .historyOverlay,
  .girlOverlay,
  .diceOverlay,
  .resultOverlay,
  .orderOverlay{
    position:fixed;
    inset:0;
    z-index:90;
    opacity:0;
    pointer-events:none;
    transition:opacity .26s ease;
  }

  .historyOverlay.show,
  .girlOverlay.show,
  .diceOverlay.show,
  .resultOverlay.show,
  .orderOverlay.show{
    opacity:1;
    pointer-events:auto;
  }

  .historyOverlay{
    background:rgba(0,0,0,.55);
  }

  .historySheet{
    position:absolute;
    left:50%;
    bottom:-82vh;
    transform:translateX(-50%);
    width:min(92vw,430px);
    height:74vh;
    background:#14151c;
    border-radius:24px 24px 0 0;
    border:1px solid rgba(255,255,255,.07);
    transition:bottom .35s ease;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .historyOverlay.show .historySheet{
    bottom:0;
  }

  .historyHead{
    padding:14px 14px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.06);
  }

  .historyTitle{
    font-size:16px;
    font-weight:900;
  }

  .closeBtn{
    appearance:none;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);
    color:#fff;
    border-radius:999px;
    padding:8px 12px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
  }

  .historyBody{
    padding:10px 14px 20px;
    overflow-y:auto;
    flex:1;
  }

  .historyLine{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:14px;
    line-height:1.55;
  }

  .historyEmpty{
    opacity:.65;
    font-size:14px;
    padding-top:8px;
  }

  .girlOverlay{
    z-index:100;
    background:#000;
  }

  .girlBg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    filter:brightness(.96);
  }

  .girlShade{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.02) 28%, rgba(0,0,0,.20) 100%);
  }

  .girlUi{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:20px 16px max(20px, env(safe-area-inset-bottom));
  }

  .girlSpeech{
    width:100%;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff;
    border-radius:28px;
    padding:16px 16px 18px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 24px rgba(0,0,0,.08);
  }

  .girlName{
    display:inline-block;
    margin-bottom:12px;
    padding:8px 15px;
    border-radius:999px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:14px;
    font-weight:900;
  }

  .girlText{
    font-size:18px;
    font-weight:900;
    line-height:1.55;
    min-height:42px;
    text-shadow:0 1px 2px rgba(0,0,0,.28);
  }

  .girlBottom{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .girlAction{
    display:none;
  }

  .girlAction.show{
    display:block;
  }

  .overlayRollBtn{
    appearance:none;
    width:100%;
    border:none;
    border-radius:20px;
    padding:18px 18px;
    font-size:17px;
    font-weight:900;
    color:#111;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    cursor:pointer;
  }

  .overlayRollBtn:disabled{
    opacity:.45;
  }

  .diceOverlay{
    background:rgba(8,8,12,.92);
    z-index:110;
  }

  .diceStage{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    padding:24px;
  }

  .diceLabel{
    font-size:20px;
    font-weight:900;
    opacity:.95;
  }

  .diceBig{
    font-size:100px;
    line-height:1;
  }

  .diceResult{
    font-size:84px;
    font-weight:900;
    line-height:1;
    min-height:92px;
  }

  .resultOverlay{
    z-index:120;
    background:rgba(5,7,12,.92);
  }

  .resultBox{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,430px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:28px;
    padding:22px 18px 18px;
    box-shadow:0 14px 36px rgba(0,0,0,.22);
  }

  .resultTitle{
    font-size:28px;
    font-weight:900;
    text-align:center;
    margin-bottom:10px;
  }

  .resultSub{
    text-align:center;
    font-size:15px;
    opacity:.92;
    margin-bottom:16px;
    line-height:1.6;
  }

  .resultList{
    background:rgba(255,255,255,.05);
    border-radius:18px;
    padding:10px;
    margin-bottom:14px;
  }

  .resultLine{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 10px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    margin-bottom:6px;
    font-size:14px;
    font-weight:800;
  }

  .resultLine:last-child{
    margin-bottom:0;
  }

  .resultButtons{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .resultBtn{
    appearance:none;
    border:none;
    border-radius:18px;
    padding:16px 14px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
  }

  .resultRetry{
    background:#fff;
    color:#111;
  }

  .resultTop{
    background:#2b3044;
    color:#fff;
    border:1px solid rgba(255,255,255,.08);
  }

  .orderOverlay{
    z-index:130;
    background:rgba(5,7,12,.94);
  }

  .orderBox{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,430px);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:28px;
    padding:22px 18px 18px;
    box-shadow:0 14px 36px rgba(0,0,0,.22);
  }

  .orderTitle{
    font-size:24px;
    font-weight:900;
    text-align:center;
    margin-bottom:12px;
  }

  .orderSub{
    text-align:center;
    font-size:14px;
    opacity:.9;
    margin-bottom:14px;
    min-height:20px;
  }

  .orderList{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .orderLine{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    background:rgba(255,255,255,.05);
    border-radius:14px;
    font-size:15px;
    font-weight:900;
  }

  .footerSpace{
    height:10px;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="title">チー娘すごろく</div>

    <div class="panel statusBox">
      <div class="statusTop">
        <span id="turnLabel">現在の番：あなた</span>
        <span>ゴール：20マス</span>
      </div>
      <div class="diceArea">
        <div class="diceEmoji">🎲</div>
        <div class="diceNum" id="diceNum">-</div>
      </div>
      <div class="subInfo" id="subInfo">ゲーム開始</div>
    </div>

    <div class="panel boardWrap">
      <div class="boardTitleRow">
        <div class="boardTitle">盤面</div>
        <button class="miniBtn" id="historyBtn" type="button">履歴</button>
      </div>
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="mainBtn" id="resetBtn" type="button">リセット</button>
    </div>

    <div class="panel ranking">
      <div class="rankingTitle">順位</div>
      <div id="rankingBody"></div>
    </div>

    <div class="footerSpace"></div>
  </div>

  <div class="girlOverlay" id="girlOverlay">
    <img src="girl1.png" alt="チー娘" class="girlBg" id="girlBg">
    <div class="girlShade"></div>

    <div class="girlUi">
      <div class="girlSpeech">
        <div class="girlName" id="girlName">チー娘A</div>
        <div class="girlText" id="girlText">いくよ。</div>
      </div>

      <div class="girlBottom">
        <div class="girlAction" id="girlAction">
          <button class="overlayRollBtn" id="overlayRollBtn" type="button">サイコロをふる</button>
        </div>
      </div>
    </div>
  </div>

  <div class="diceOverlay" id="diceOverlay">
    <div class="diceStage">
      <div class="diceLabel" id="diceLabel">サイコロ…</div>
      <div class="diceBig">🎲</div>
      <div class="diceResult" id="diceResult">?</div>
    </div>
  </div>

  <div class="resultOverlay" id="resultOverlay">
    <div class="resultBox">
      <div class="resultTitle" id="resultTitle">あなたの勝ち！</div>
      <div class="resultSub" id="resultSub">先にゴールしました。</div>
      <div class="resultList" id="resultList"></div>
      <div class="resultButtons">
        <button class="resultBtn resultRetry" id="retryBtn" type="button">もう一回</button>
        <button class="resultBtn resultTop" id="topBtn" type="button">トップに戻る</button>
      </div>
    </div>
  </div>

  <div class="orderOverlay" id="orderOverlay">
    <div class="orderBox">
      <div class="orderTitle">順番を決めるよ</div>
      <div class="orderSub" id="orderSub">シャッフル中…</div>
      <div class="orderList" id="orderList"></div>
    </div>
  </div>

  <div class="historyOverlay" id="historyOverlay">
    <div class="historySheet">
      <div class="historyHead">
        <div class="historyTitle">履歴</div>
        <button class="closeBtn" id="closeHistoryBtn" type="button">閉じる</button>
      </div>
      <div class="historyBody" id="historyBody"></div>
    </div>
  </div>

<script>
  const GOAL = 20;
  const STEP_DELAY = 260;

  const players = [
    { id:"you", label:"あなた", short:"自", pos:0, type:"human", turnOrder:0 },
    { id:"a", label:"チー娘A", short:"A", pos:0, type:"cpu", girlIndex:0, turnOrder:0 },
    { id:"b", label:"チー娘B", short:"B", pos:0, type:"cpu", girlIndex:1, turnOrder:0 },
    { id:"c", label:"チー娘C", short:"C", pos:0, type:"cpu", girlIndex:2, turnOrder:0 }
  ];

  const girls = [
    {
      name:"チー娘A",
      image:"girl1.png",
      introHuman:["あなたの番だよ。","ここを押したら振るよ。","準備できたらどうぞ。"],
      introCpu:["いくよ。","始まるよ。","見てて。"],
      move:["いい感じ。","まあまあ進んだね。","その調子。"],
      plus:["ちょっと得したね。","ラッキーだよ。","進んでいいよ。"],
      minus:["ちょっと戻ろっか。","少し下がるね。","ここは戻るみたい。"],
      again:["もう1回どうぞ。","続けて振っていいよ。","もう一度いけるよ。"],
      winYou:["やった、あなたの勝ち。","先にゴールだね。","勝ち、おめでとう。"],
      loseToCpu:["惜しかったね。","あと少しだった。","次はいけるよ。"],
      winCpu:["やった、私が1番。","先に着いたよ。","勝っちゃった。"]
    },
    {
      name:"チー娘B",
      image:"girl2.png",
      introHuman:["ほら、あなたの番。","ここを押したら始まるよ。","準備できた？"],
      introCpu:["ほら、始まるよ。","見てなさい。","出るかな。"],
      move:["悪くない。","まあ、こんなもんかな。","まだこれからでしょ。"],
      plus:["ちょっと運いいじゃん。","はい、進んでいいよ。","ラッキーなんじゃない？"],
      minus:["少し戻るみたい。","まあ、そういう時もある。","戻ってね。"],
      again:["もう1回ね。","続けてどうぞ。","今回はもう1回でいいよ。"],
      winYou:["あなたの勝ちか。まあいいけど。","先に着いたのね。","はいはい、おめでとう。"],
      loseToCpu:["惜しかったんじゃない？","あと少しだったね。","まあ、次かな。"],
      winCpu:["私の勝ち。まあ当然かな。","ほらね、勝った。","先にゴールしたけど？"]
    },
    {
      name:"チー娘C",
      image:"girl3.png",
      introHuman:["あなたの番。","ここを押して。","……準備できたら。"],
      introCpu:["……いく。","始まる。","出る。"],
      move:["進んだ。","悪くない。","まだ行ける。"],
      plus:["さらに進む。","得した。","前へ。"],
      minus:["少し下がる。","戻る。","……しかたない。"],
      again:["もう1回。","続けて。","再挑戦。"],
      winYou:["ゴール。あなたの勝ち。","……先だったね。","勝ち。おめでとう。"],
      loseToCpu:["あと少し。","……惜しかった。","次。"],
      winCpu:["ゴール。私の勝ち。","……先だった。","終わり。勝った。"]
    }
  ];

  const eventMap = {
    3:  { type:"plus",  value:2 },
    6:  { type:"minus", value:2 },
    8:  { type:"again", value:0 },
    11: { type:"plus",  value:1 },
    14: { type:"minus", value:3 },
    17: { type:"again", value:0 }
  };

  let turnIndex = 0;
  let gameEnded = false;
  let busy = false;
  let historyLogs = [];
  let waitingForUserRoll = false;
  let currentSpeakerGirl = 0;
  let activeStepCell = null;

  const boardEl = document.getElementById("board");
  const rankingBodyEl = document.getElementById("rankingBody");
  const turnLabelEl = document.getElementById("turnLabel");
  const diceNumEl = document.getElementById("diceNum");
  const subInfoEl = document.getElementById("subInfo");
  const resetBtn = document.getElementById("resetBtn");
  const historyBtn = document.getElementById("historyBtn");

  const girlOverlay = document.getElementById("girlOverlay");
  const girlBg = document.getElementById("girlBg");
  const girlNameEl = document.getElementById("girlName");
  const girlTextEl = document.getElementById("girlText");
  const girlActionEl = document.getElementById("girlAction");
  const overlayRollBtn = document.getElementById("overlayRollBtn");

  const diceOverlay = document.getElementById("diceOverlay");
  const diceLabelEl = document.getElementById("diceLabel");
  const diceResultEl = document.getElementById("diceResult");

  const resultOverlay = document.getElementById("resultOverlay");
  const resultTitle = document.getElementById("resultTitle");
  const resultSub = document.getElementById("resultSub");
  const resultList = document.getElementById("resultList");
  const retryBtn = document.getElementById("retryBtn");
  const topBtn = document.getElementById("topBtn");

  const orderOverlay = document.getElementById("orderOverlay");
  const orderSub = document.getElementById("orderSub");
  const orderList = document.getElementById("orderList");

  const historyOverlay = document.getElementById("historyOverlay");
  const historyBody = document.getElementById("historyBody");
  const closeHistoryBtn = document.getElementById("closeHistoryBtn");

  function rand(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function shuffle(array){
    const arr = [...array];
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getGirlIndexForTurn(player){
    if(player.type === "human"){
      return Math.floor(Math.random() * 3);
    }
    return player.girlIndex;
  }

  function updateButtons(){
    overlayRollBtn.disabled = !(waitingForUserRoll && !busy && !gameEnded);
    historyBtn.disabled = busy || resultOverlay.classList.contains("show") || orderOverlay.classList.contains("show");
  }

  function setBusy(flag){
    busy = flag;
    updateButtons();
  }

  function getTurnSortedPlayers(){
    return [...players].sort((a,b) => a.turnOrder - b.turnOrder);
  }

  function getCurrentPlayer(){
    return getTurnSortedPlayers()[turnIndex];
  }

  function updateTurnLabel(){
    const current = getCurrentPlayer();
    turnLabelEl.textContent = `現在の番：${current.label}`;
  }

  function setSubInfo(text){
    subInfoEl.textContent = text;
  }

  function addHistory(text){
    historyLogs.unshift(text);
    renderHistory();
  }

  function renderHistory(){
    historyBody.innerHTML = "";
    if(!historyLogs.length){
      const empty = document.createElement("div");
      empty.className = "historyEmpty";
      empty.textContent = "まだ履歴はありません。";
      historyBody.appendChild(empty);
      return;
    }

    historyLogs.forEach(line => {
      const div = document.createElement("div");
      div.className = "historyLine";
      div.textContent = line;
      historyBody.appendChild(div);
    });
  }

  function openHistory(){
    if(busy || resultOverlay.classList.contains("show") || orderOverlay.classList.contains("show")) return;
    historyOverlay.classList.add("show");
  }

  function closeHistory(){
    historyOverlay.classList.remove("show");
  }

  function showGirl(girlIndex, text, showAction = false){
    girlNameEl.textContent = girls[girlIndex].name;
    girlTextEl.textContent = text;
    girlBg.src = girls[girlIndex].image;
    girlActionEl.classList.toggle("show", showAction);
    girlOverlay.classList.add("show");
  }

  function hideGirl(){
    girlOverlay.classList.remove("show");
    girlActionEl.classList.remove("show");
  }

  function showDice(label, value = "?"){
    diceLabelEl.textContent = label;
    diceResultEl.textContent = value;
    diceOverlay.classList.add("show");
  }

  function hideDice(){
    diceOverlay.classList.remove("show");
  }

  function getFinalRanking(){
    return [...players].sort((a, b) => b.pos - a.pos);
  }

  function showResultScreen(winner){
    const sorted = getFinalRanking();
    resultList.innerHTML = "";

    sorted.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "resultLine";
      row.innerHTML = `<span>${i + 1}位　${p.label}</span><span>${p.pos} / ${GOAL}</span>`;
      resultList.appendChild(row);
    });

    if(winner.id === "you"){
      resultTitle.textContent = "あなたの勝ち！";
      resultSub.textContent = "やったね。先にゴールしました。";
    } else {
      resultTitle.textContent = `${winner.label}の勝ち！`;
      resultSub.textContent = "惜しかった。あと少しでした。";
    }

    resultOverlay.classList.add("show");
    updateButtons();
  }

  function hideResultScreen(){
    resultOverlay.classList.remove("show");
    updateButtons();
  }

  async function playEndingEmotion(winner){
    if(winner.id === "you"){
      const girlIndex = Math.floor(Math.random() * 3);
      showGirl(girlIndex, rand(girls[girlIndex].winYou), false);
      await wait(1700);
      hideGirl();
      await wait(200);
    } else {
      const girlIndex = winner.girlIndex;
      showGirl(girlIndex, rand(girls[girlIndex].winCpu), false);
      await wait(1700);
      hideGirl();
      await wait(200);

      const comfortGirl = Math.floor(Math.random() * 3);
      showGirl(comfortGirl, rand(girls[comfortGirl].loseToCpu), false);
      await wait(1500);
      hideGirl();
      await wait(150);
    }
  }

  async function playTurnOrderAnimation(){
    orderOverlay.classList.add("show");
    updateButtons();

    const base = [...players];
    for(let i = 0; i < 7; i++){
      const temp = shuffle(base);
      renderOrderList(temp, false);
      orderSub.textContent = "シャッフル中…";
      await wait(180);
    }

    const finalOrder = shuffle(base);
    finalOrder.forEach((p, idx) => p.turnOrder = idx);
    renderOrderList(finalOrder, true);
    orderSub.textContent = "順番決定！";
    addHistory(`順番決定：${finalOrder.map((p, idx) => `${idx + 1}番 ${p.label}`).join(" / ")}`);
    await wait(1500);

    orderOverlay.classList.remove("show");
    updateButtons();
  }

  function renderOrderList(list, fixed){
    orderList.innerHTML = "";
    list.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = "orderLine";
      row.innerHTML = `<span>${i + 1}番</span><span>${p.label}${fixed ? "" : ""}</span>`;
      orderList.appendChild(row);
    });
  }

  function movePlayer(player, amount){
    player.pos = Math.max(0, Math.min(GOAL, player.pos + amount));
  }

  function clearActiveStep(){
    activeStepCell = null;
    document.querySelectorAll(".cell.active-step").forEach(el => {
      el.classList.remove("active-step");
    });
  }

  function drawBoard(){
    boardEl.innerHTML = "";

    for(let i = 0; i <= GOAL; i++){
      const cell = document.createElement("div");
      let cls = "cell";
      if(i === GOAL) cls += " goal";
      if(eventMap[i]?.type === "plus") cls += " event-plus";
      if(eventMap[i]?.type === "minus") cls += " event-minus";
      if(eventMap[i]?.type === "again") cls += " event-again";
      if(activeStepCell === i) cls += " active-step";
      cell.className = cls;

      const num = document.createElement("div");
      num.className = "cellNum";
      num.textContent = i === GOAL ? "GOAL" : i;
      cell.appendChild(num);

      if(eventMap[i]){
        const mark = document.createElement("div");
        mark.className = "eventMark";
        if(eventMap[i].type === "plus") mark.textContent = `+${eventMap[i].value}`;
        if(eventMap[i].type === "minus") mark.textContent = `-${eventMap[i].value}`;
        if(eventMap[i].type === "again") mark.textContent = "↺";
        cell.appendChild(mark);
      }

      const tokens = document.createElement("div");
      tokens.className = "tokens";

      players.forEach(player => {
        if(player.pos === i){
          const token = document.createElement("div");
          token.className = `token ${player.id}`;
          token.textContent = player.short;
          tokens.appendChild(token);
        }
      });

      cell.appendChild(tokens);
      boardEl.appendChild(cell);
    }
  }

  function updateRanking(){
    const sorted = getFinalRanking();
    rankingBodyEl.innerHTML = "";

    sorted.forEach((p, index) => {
      const row = document.createElement("div");
      row.className = "rankLine";
      row.innerHTML = `<span>${index + 1}位　${p.label}</span><span>${p.pos} / ${GOAL}</span>`;
      rankingBodyEl.appendChild(row);
    });
  }

  async function animateMove(player, steps){
    if(steps <= 0) return;

    for(let i = 0; i < steps; i++){
      if(player.pos >= GOAL) break;
      player.pos += 1;
      activeStepCell = player.pos;
      drawBoard();
      updateRanking();
      setSubInfo(`${player.label} が ${player.pos} マス目へ`);
      await wait(STEP_DELAY);
    }

    clearActiveStep();
    drawBoard();
    updateRanking();
  }

  async function introForCurrentTurn(){
    const player = getCurrentPlayer();
    const girlIndex = getGirlIndexForTurn(player);
    currentSpeakerGirl = girlIndex;
    updateTurnLabel();

    if(player.type === "human"){
      waitingForUserRoll = true;
      setSubInfo("あなたの番です");
      showGirl(girlIndex, rand(girls[girlIndex].introHuman), true);
      updateButtons();
    } else {
      waitingForUserRoll = false;
      updateButtons();
      setSubInfo("チー娘の番です");
      showGirl(girlIndex, rand(girls[girlIndex].introCpu), false);
      await wait(1700);
      hideGirl();
      await wait(350);
      await executeRoll();
    }
  }

  async function showResultReaction(girlIndex, text){
    showGirl(girlIndex, text, false);
    await wait(1700);
    hideGirl();
    await wait(280);
  }

  async function handleEvent(player, girlIndex){
    const event = eventMap[player.pos];
    if(!event || player.pos >= GOAL) return false;

    if(event.type === "plus"){
      const before = player.pos;
      setSubInfo(`イベント：+${event.value}マス`);
      await animateMove(player, event.value);
      addHistory(`${player.label} はイベントで ${event.value} マス進んだ（${before} → ${player.pos}）`);
      await showResultReaction(girlIndex, rand(girls[girlIndex].plus));

      if(player.pos >= GOAL){
        await handleWin(player, girlIndex);
      }
      return false;
    }

    if(event.type === "minus"){
      const before = player.pos;
      player.pos = Math.max(0, player.pos - event.value);
      activeStepCell = player.pos;
      drawBoard();
      updateRanking();
      await wait(350);
      clearActiveStep();
      drawBoard();
      updateRanking();
      setSubInfo(`イベント：-${event.value}マス`);
      addHistory(`${player.label} はイベントで ${event.value} マス戻った（${before} → ${player.pos}）`);
      await showResultReaction(girlIndex, rand(girls[girlIndex].minus));
      return false;
    }

    if(event.type === "again"){
      setSubInfo("イベント：もう1回");
      addHistory(`${player.label} はイベントでもう1回。`);
      await showResultReaction(girlIndex, rand(girls[girlIndex].again));

      waitingForUserRoll = false;
      updateButtons();

      if(player.type === "human"){
        waitingForUserRoll = true;
        showGirl(girlIndex, rand(girls[girlIndex].introHuman), true);
        updateButtons();
      } else {
        await wait(300);
        showGirl(girlIndex, rand(girls[girlIndex].introCpu), false);
        await wait(1200);
        hideGirl();
        await wait(200);
        await executeRoll(true);
      }
      return true;
    }

    return false;
  }

  async function handleWin(player, girlIndex){
    gameEnded = true;
    waitingForUserRoll = false;
    updateButtons();
    updateRanking();

    addHistory(`${player.label} がゴール。`);

    showDice("ゴール", "★");
    await wait(1300);
    hideDice();
    await wait(150);

    await playEndingEmotion(player);
    showResultScreen(player);
  }

  async function executeRoll(isRepeat = false){
    if(gameEnded || busy) return;

    setBusy(true);

    const player = getCurrentPlayer();
    const girlIndex = currentSpeakerGirl || getGirlIndexForTurn(player);
    const before = player.pos;

    waitingForUserRoll = false;
    updateButtons();
    hideGirl();
    await wait(250);

    showDice(isRepeat ? "もう一回…" : "サイコロ…", "?");
    await wait(350);
    diceResultEl.textContent = "1";
    await wait(220);
    diceResultEl.textContent = "4";
    await wait(220);
    diceResultEl.textContent = "2";
    await wait(220);
    diceResultEl.textContent = "6";
    await wait(260);

    const dice = Math.floor(Math.random() * 6) + 1;
    diceResultEl.textContent = dice;
    diceNumEl.textContent = dice;
    setSubInfo(`${dice}マス進む`);
    await wait(900);
    hideDice();
    await wait(150);

    await animateMove(player, dice);
    addHistory(`${player.label} が ${dice} マス進んだ（${before} → ${player.pos}）`);
    setSubInfo(`${player.pos} マス目に到着`);

    await showResultReaction(girlIndex, rand(girls[girlIndex].move));

    if(player.pos >= GOAL){
      await handleWin(player, girlIndex);
      setBusy(false);
      return;
    }

    const again = await handleEvent(player, girlIndex);
    if(gameEnded){
      setBusy(false);
      return;
    }
    if(again){
      setBusy(false);
      return;
    }

    turnIndex = (turnIndex + 1) % players.length;
    setBusy(false);
    await wait(700);
    await introForCurrentTurn();
  }

  async function resetGame(showOrder = true){
    hideGirl();
    hideDice();
    hideResultScreen();
    orderOverlay.classList.remove("show");
    clearActiveStep();

    players.forEach(p => {
      p.pos = 0;
      p.turnOrder = 0;
    });

    turnIndex = 0;
    gameEnded = false;
    busy = false;
    historyLogs = [];
    waitingForUserRoll = false;
    currentSpeakerGirl = 0;

    diceNumEl.textContent = "-";

    drawBoard();
    updateRanking();
    renderHistory();
    setSubInfo("ゲーム開始");
    updateButtons();

    if(showOrder){
      await playTurnOrderAnimation();
    } else {
      const fixed = [...players];
      fixed.forEach((p, idx) => p.turnOrder = idx);
    }

    updateTurnLabel();
    addHistory("ゲーム開始。");
    await wait(500);
    await introForCurrentTurn();
  }

  overlayRollBtn.addEventListener("click", async () => {
    if(!waitingForUserRoll || busy || gameEnded) return;
    await executeRoll(false);
  });

  historyBtn.addEventListener("click", openHistory);
  closeHistoryBtn.addEventListener("click", closeHistory);
  historyOverlay.addEventListener("click", (e) => {
    if(e.target === historyOverlay) closeHistory();
  });

  resetBtn.addEventListener("click", () => resetGame(true));
  retryBtn.addEventListener("click", () => resetGame(true));
  topBtn.addEventListener("click", () => resetGame(true));

  resetGame(true);
</script>
</body>
</html>
